{% extends "base.html" %}

{% block content %}

<div class="formbox wide">

<h1>
{% if product %}
Editar produto
{% else %}
Novo produto
{% endif %}
</h1>

<form method="post" enctype="multipart/form-data">

<label>Nome</label>
<input name="name" value="{{ product.name if product else '' }}" required>

<label>Versão</label>
<input name="version" value="{{ product.version if product else '1.0' }}">

<label>Preço</label>
<input type="number" step="0.01" name="price"
value="{{ product.price if product else '19.00' }}">

<label>Descrição</label>
<textarea name="description">{{ product.description if product else '' }}</textarea>

<label>Recursos</label>
<textarea name="features">{{ product.features if product else '' }}</textarea>

<p class="muted">Separe os recursos usando |</p>

<label>Requisitos</label>
<textarea name="requirements">{{ product.requirements if product else '' }}</textarea>

<label>Tamanho</label>
<input name="size" value="{{ product.size if product else '' }}">

<label>Sistema</label>
<input name="os" value="{{ product.os if product else 'Windows 10/11' }}">

{% if product %}

<label class="check">
<input type="checkbox" name="active" {% if product.active %}checked{% endif %}>
Produto ativo
</label>

<label>Arquivo EXE</label>
<input type="file" name="exe" accept=".exe">

{% endif %}

<button class="button large">
Salvar produto
</button>

</form>

{% if product %}

<form method="post"
action="{{ url_for('delete_product',product_id=product.id) }}"
onsubmit="return confirm('Excluir este produto?')">

<button class="button danger">
Excluir produto
</button>

</form>

{% endif %}

<a href="{{ url_for('admin') }}">← Voltar</a>

</div>

{% endblock %}
